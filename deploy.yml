name: Publicar Juego Web
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar archivos reales (incluyendo LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Subir web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
